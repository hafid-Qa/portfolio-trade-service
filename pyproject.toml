[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Portfolio-API"
version = "0.1.0"
description = "API for the Portfolio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.140.0,<1",
  "PyYAML>=6.0.3,<7",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true


[project.optional-dependencies]
dev = [
  "coverage[toml]>=7,<8",
  "httpx2>=2.9,<3.0",
  "ruff>=0.8,<1.0",
  "pytest>=8.0,<9.0",
  "pytest-xdist>=3.5",
  "pytest-asyncio>=0.23,<1.0",
  "pytest-cov>=5,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--tb=short -n 3 --dist=loadscope --cov=. --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=report.xml  --durations=25"
norecursedirs = [".venv", "data","scripts"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
cache-dir = "/tmp/ruff_cache"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]


[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "google"
